<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>1WEN's Garden</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  overflow:hidden;
  background:#050817;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
button{font-family:inherit}

/* =========================
   首頁
========================= */

.home{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  background-image:
    linear-gradient(rgba(5,8,25,.08),rgba(5,8,25,.30)),
    url("./garden-bg.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.worlds{
  position:absolute;
  z-index:10;
  left:50%;
  bottom:6vh;
  transform:translateX(-50%);
  width:min(90%,650px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:18px;
}

.world{
  width:clamp(85px,22vw,135px);
  aspect-ratio:1/1;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  background:radial-gradient(
    circle at 35% 30%,
    rgba(255,255,255,.30),
    rgba(20,25,55,.35) 60%,
    rgba(10,15,40,.45)
  );
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  transition:transform .25s;
}

.world:active{transform:scale(.92)}

.icon{
  font-size:clamp(44px,11vw,70px);
  line-height:1;
}

.star-button{
  box-shadow:0 0 32px rgba(255,220,110,.30),0 8px 30px rgba(0,0,0,.4)
}
.garden-button{
  box-shadow:0 0 32px rgba(255,150,190,.25),0 8px 30px rgba(0,0,0,.4)
}
.bunny-button{
  box-shadow:0 0 32px rgba(255,255,255,.22),0 8px 30px rgba(0,0,0,.4)
}

/* 返回 */

.back-button{
  position:absolute;
  z-index:100;
  top:max(18px,env(safe-area-inset-top));
  left:18px;
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  color:white;
  font-size:25px;
  cursor:pointer;
  background:rgba(15,20,50,.42);
  backdrop-filter:blur(8px);
}

/* =========================
   ⭐ 星星世界
========================= */

.star-world{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 100%,#18275a 0%,transparent 48%),
    radial-gradient(circle at 15% 20%,rgba(91,76,170,.32),transparent 35%),
    linear-gradient(#06091e,#101637 55%,#080b20);
}

.star-world.open{display:block}

.star-world::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(170,190,255,.6) 1px,transparent 1.5px);
  background-size:72px 72px,113px 113px;
  background-position:10px 20px,40px 55px;
  opacity:.35;
}

#starField{
  position:absolute;
  inset:0;
}

.sky-star{
  position:absolute;
  width:54px;
  height:54px;
  transform:translate(-50%,-50%);
  border:0;
  background:transparent;
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#ffe48a;
  font-size:26px;
  text-shadow:
    0 0 7px rgba(255,230,130,.95),
    0 0 18px rgba(255,205,80,.65);
}

.sky-star::before{content:"✦"}
.sky-star:nth-child(3n){font-size:20px}
.sky-star:nth-child(4n){font-size:31px}
.sky-star.revealed::before{content:""}
.sky-star.revealed{font-size:27px}

.sky-star.special.found{
  color:#fff0a8;
  filter:
    drop-shadow(0 0 8px #ffd66b)
    drop-shadow(0 0 20px #ffbf45);
  animation:specialGlow 2.2s ease-in-out infinite;
}

.star-name{
  position:absolute;
  top:42px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#fff1bd;
  font-size:15px;
  font-weight:bold;
}

@keyframes specialGlow{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.22)}
}

.hint-glow{
  position:absolute;
  width:85px;
  height:85px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  background:radial-gradient(
    circle,
    rgba(255,215,100,.28),
    rgba(255,190,70,.08) 45%,
    transparent 70%
  );
  opacity:0;
  animation:hintPulse 3s ease-in-out infinite;
}

@keyframes hintPulse{
  0%,60%,100%{opacity:0}
  75%{opacity:.85}
}

.connection-line{
  position:absolute;
  height:2px;
  transform-origin:left center;
  pointer-events:none;
  background:linear-gradient(
    90deg,
    rgba(255,215,110,.15),
    rgba(255,230,150,.75),
    rgba(255,215,110,.15)
  );
  box-shadow:0 0 10px rgba(255,215,100,.55);
  opacity:0;
  transition:opacity 1s;
}

.connection-line.show{opacity:1}

/* =========================
   🌷 花園世界
========================= */

.garden-world{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  overflow:hidden;
  color:#68585d;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.9),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(255,221,230,.65),transparent 30%),
    linear-gradient(180deg,#fff8ef 0%,#fceeea 58%,#e6efd9 100%);
}

.garden-world.open{display:block}

.garden-world .back-button,
.garden-room .back-button{
  color:#806b72;
  background:rgba(255,255,255,.55);
  border-color:rgba(120,90,100,.15);
}

.garden-title{
  position:absolute;
  top:16%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-family:Georgia,serif;
  font-size:clamp(28px,6vw,46px);
  font-weight:normal;
  color:#806c72;
}

.garden-choices{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  width:min(88%,600px);
  display:flex;
  justify-content:center;
  gap:clamp(22px,8vw,70px);
}

.garden-choice{
  width:clamp(125px,32vw,190px);
  aspect-ratio:1/1;
  border:none;
  border-radius:50%;
  cursor:pointer;
  background:rgba(255,255,255,.55);
  box-shadow:
    0 12px 35px rgba(130,100,100,.12),
    inset 0 0 25px rgba(255,255,255,.65);
  font-size:clamp(58px,14vw,90px);
}

.garden-grass{
  position:absolute;
  bottom:-5%;
  left:-5%;
  width:110%;
  height:25%;
  border-radius:50% 50% 0 0;
  background:rgba(182,207,153,.32);
}

.garden-room{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.95),transparent 30%),
    linear-gradient(180deg,#fff9f2,#f9e9e7 62%,#e9f0df);
}

.garden-room.open{display:block}

/* 呼吸花 */

.breathe-text{
  position:absolute;
  top:18%;
  width:100%;
  text-align:center;
  font-family:Georgia,serif;
  font-size:clamp(22px,5vw,34px);
  color:#806a72;
}

.breathing-flower{
  position:absolute;
  left:50%;
  top:49%;
  transform:translate(-50%,-50%);
  font-size:clamp(110px,28vw,190px);
  filter:drop-shadow(0 12px 20px rgba(160,100,120,.15));
  animation:breatheFlower 7s ease-in-out infinite;
}

.breathing-flower.paused{
  animation-play-state:paused;
}

@keyframes breatheFlower{
  0%{
    transform:translate(-50%,-50%) scale(.78);
    opacity:.82
  }
  43%{
    transform:translate(-50%,-50%) scale(1.12);
    opacity:1
  }
  100%{
    transform:translate(-50%,-50%) scale(.78);
    opacity:.82
  }
}

.pause-button{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translateX(-50%);
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  color:#806a72;
  background:rgba(255,255,255,.68);
  font-size:22px;
}

/* 種花 */

.grow-area{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  width:min(90%,500px);
  height:430px;
}

.grow-display{
  position:absolute;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  width:250px;
  height:260px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.plant{
  position:relative;
  width:180px;
  height:240px;
}

.soil{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:180px;
  height:42px;
  border-radius:50%;
  background:#a77962;
}

.seed{
  position:absolute;
  left:50%;
  bottom:31px;
  transform:translateX(-50%);
  width:13px;
  height:9px;
  border-radius:50%;
  background:#76533f;
}

.sprout{
  position:absolute;
  left:50%;
  bottom:38px;
  width:5px;
  height:0;
  transform:translateX(-50%);
  border-radius:5px;
  background:#76a56a;
  transition:height .5s;
}

.sprout.show{height:38px}

.sprout.show::before,
.sprout.show::after{
  content:"";
  position:absolute;
  width:24px;
  height:13px;
  top:8px;
  background:#8ab979;
}

.sprout.show::before{
  right:2px;
  border-radius:100% 0 100% 0;
}

.sprout.show::after{
  left:2px;
  top:19px;
  border-radius:0 100% 0 100%;
}

.stem{
  position:absolute;
  left:50%;
  bottom:38px;
  transform:translateX(-50%);
  width:7px;
  height:0;
  border-radius:5px;
  background:#6f9e62;
  transition:height .7s;
}

.stem.show{height:125px}

.stem.show::before,
.stem.show::after{
  content:"";
  position:absolute;
  width:42px;
  height:20px;
  background:#8ab979;
}

.stem.show::before{
  top:55px;
  right:3px;
  border-radius:100% 0 100% 0;
}

.stem.show::after{
  top:82px;
  left:3px;
  border-radius:0 100% 0 100%;
}

.final-flower{
  position:absolute;
  left:50%;
  bottom:143px;
  transform:translateX(-50%) scale(0);
  font-size:82px;
  transition:transform .8s cubic-bezier(.2,1.5,.4,1);
}

.final-flower.show{
  transform:translateX(-50%) scale(1);
}

.water-button{
  position:absolute;
  left:50%;
  bottom:330px;
  transform:translateX(-50%);
  width:88px;
  height:88px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  font-size:48px;
  background:rgba(255,255,255,.72);S
}
.water-button:active{
  transform:translateX(-50%) rotate(-15deg) scale(.95);
}
.water-drop{
  position:absolute;
  left:50%;
  bottom:285px;
  transform:translateX(-50%);
  font-size:24px;
  pointer-events:none;
  animation:waterFall .7s ease forwards;
}

@keyframes waterFall{
  from{
    opacity:1;
    transform:translate(-50%,-15px)
  }
  to{
    opacity:0;
    transform:translate(-50%,45px)
  }
}

.grow-progress{
  position:absolute;
  left:50%;
  bottom:72px;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
}

.progress-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(120,100,100,.18);
}

.progress-dot.done{background:#d99aa8}

/* =========================
   🐰 兔兔世界
========================= */

.bunny-world{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,rgba(255,255,255,.95),transparent 32%),
    linear-gradient(180deg,#fff7ed 0%,#ffe8e2 58%,#e8efd9 100%);
}

.bunny-world.open{display:block}

.bunny-world .back-button{
  color:#806b72;
  background:rgba(255,255,255,.58);
  border-color:rgba(120,90,100,.15);
}

/* 背景裝飾 */

.bunny-cloud{
  position:absolute;
  color:rgba(255,255,255,.75);
  font-size:70px;
  user-select:none;
}

.cloud-one{
  top:13%;
  left:8%;
}

.cloud-two{
  top:21%;
  right:8%;
  transform:scale(.7);
}

.bunny-ground{
  position:absolute;
  left:-5%;
  bottom:-7%;
  width:110%;
  height:30%;
  border-radius:50% 50% 0 0;
  background:#dce9c8;
}

/* 訊息 */

.bunny-message{
  position:absolute;
  z-index:5;
  top:14%;
  left:50%;
  transform:translateX(-50%);
  width:min(86%,650px);
  min-height:90px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#765f64;
  font-size:clamp(22px,5vw,36px);
  font-weight:600;
  line-height:1.45;
  opacity:0;
  transition:
    opacity .45s ease,
    transform .45s ease;
}

.bunny-message.show{
  opacity:1;
  transform:translateX(-50%) translateY(5px);
}

/* 兔兔區 */

.bunny-scene{
  position:absolute;
  z-index:4;
  left:50%;
  top:57%;
  transform:translate(-50%,-50%);
  width:min(90vw,480px);
  height:390px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* 兔兔 */

.big-bunny{
  position:absolute;
  left:50%;
  bottom:55px;
  transform:translateX(-50%);
  font-size:clamp(150px,38vw,230px);
  line-height:1;
  filter:drop-shadow(0 15px 15px rgba(130,100,100,.13));
  transition:transform .15s ease;
}

.bunny-scene.bite .big-bunny{
  transform:translateX(-50%) scale(1.06) rotate(-2deg);
}

/* 愛心 */

.bunny-heart{
  position:absolute;
  left:66%;
  top:55px;
  font-size:35px;
  opacity:0;
  pointer-events:none;
}

.bunny-heart.pop{
  animation:heartPop .8s ease forwards;
}

@keyframes heartPop{
  0%{
    opacity:0;
    transform:translateY(15px) scale(.5)
  }
  30%{
    opacity:1;
    transform:translateY(0) scale(1.2)
  }
  100%{
    opacity:0;
    transform:translateY(-45px) scale(.9)
  }
}

/* 紅蘿蔔 */

.carrot-area{
  position:absolute;
  z-index:6;
  left:62%;
  bottom:75px;
  transform:rotate(-28deg);
}

.carrot{
  font-size:clamp(75px,18vw,110px);
  display:block;
  transform-origin:bottom center;
  transition:
    transform .2s ease,
    opacity .25s ease;
}

.bunny-scene.bite .carrot{
  transform:scale(.88) rotate(-6deg);
}

/* 每咬一口的小碎屑 */

.crumb{
  position:absolute;
  z-index:10;
  left:61%;
  bottom:160px;
  font-size:18px;
  pointer-events:none;
  animation:crumbFly .7s ease forwards;
}

@keyframes crumbFly{
  0%{
    opacity:1;
    transform:translate(0,0) rotate(0)
  }
  100%{
    opacity:0;
    transform:translate(35px,-45px) rotate(90deg)
  }
}

/* 小提示 */

.tap-hint{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  color:#a3878c;
  font-size:14px;
  letter-spacing:1px;
  opacity:.65;
  animation:tapHint 2.2s ease-in-out infinite;
}

@keyframes tapHint{
  0%,100%{opacity:.35}
  50%{opacity:.8}
}

/* 語言小標示 */

.language-indicator{
  position:absolute;
  z-index:5;
  right:20px;
  top:max(25px,env(safe-area-inset-top));
  color:#9b8186;
  font-size:13px;
  opacity:.55;
}

/* =========================
   手機
========================= */

@media(max-width:600px){

  .worlds{
    bottom:max(5vh,35px);
    width:94%;
    gap:8px;
  }

  .world{
    width:27vw;
    max-width:105px;
  }

  .icon{
    font-size:clamp(42px,13vw,60px);
  }

  .sky-star{
    width:48px;
    height:48px;
  }

  .garden-choices{
    gap:18px;
  }

  .garden-choice{
    width:38vw;
    max-width:155px;
  }

  .grow-area{
    height:410px;
  }

  .bunny-scene{
    top:59%;
    height:350px;
  }

  .big-bunny{
    bottom:55px;
  }

  .carrot-area{
    left:63%;
    bottom:80px;
  }

  .bunny-message{
    top:15%;
    font-size:clamp(20px,6vw,29px);
  }
}
</style>
</head>

<body>

<!-- 首頁 -->

<main class="home">

  <div class="worlds">

    <button
      class="world star-button"
      type="button"
      onclick="openStarWorld()"
      aria-label="星星世界">
      <span class="icon">⭐</span>
    </button>

    <button
      class="world garden-button"
      type="button"
      onclick="openGardenWorld()"
      aria-label="花園世界">
      <span class="icon">🌷</span>
    </button>

    <button
      class="world bunny-button"
      type="button"
      onclick="openBunnyWorld()"
      aria-label="兔兔世界">
      <span class="icon">🐰</span>
    </button>

  </div>

</main>


<!-- ⭐ 星星世界 -->

<section id="starWorld" class="star-world">

  <button
    class="back-button"
    type="button"
    onclick="closeStarWorld()">‹</button>

  <div id="starField"></div>

</section>


<!-- 🌷 花園首頁 -->

<section id="gardenWorld" class="garden-world">

  <button
    class="back-button"
    type="button"
    onclick="closeGardenWorld()">‹</button>

  <h1 class="garden-title">1WEN's Garden</h1>

  <div class="garden-choices">

    <button
      class="garden-choice"
      type="button"
      onclick="openBreathingGarden()">🌸</button>

    <button
      class="garden-choice"
      type="button"
      onclick="openGrowingGarden()">🌱</button>

  </div>

  <div class="garden-grass"></div>

</section>


<!-- 🌸 呼吸花 -->

<section id="breathingGarden" class="garden-room">

  <button
    class="back-button"
    type="button"
    onclick="closeBreathingGarden()">‹</button>

  <div class="breathe-text">
    Breathe with the flower
  </div>

  <div
    id="breathingFlower"
    class="breathing-flower">🌸</div>

  

</section>


<!-- 🌱 種花 -->

<section id="growingGarden" class="garden-room">

  <button
    class="back-button"
    type="button"
    onclick="closeGrowingGarden()">‹</button>

  <div class="grow-area">

    <div class="grow-display">

      <div class="plant">

        <div class="soil"></div>
        <div class="seed"></div>

        <div
          id="sprout"
          class="sprout"></div>

        <div
          id="stem"
          class="stem"></div>

        <div
          id="finalFlower"
          class="final-flower"></div>

      </div>

    </div>

    <div
      id="growProgress"
      class="grow-progress"></div>

    <button
      class="water-button"
      type="button"
      onclick="waterPlant()">
  <svg viewBox="0 0 120 90" width="68" height="55" aria-hidden="true">
    <path d="M31 35 H78 V72 H31 Z" fill="#e7aebb"/>
    <path d="M77 42 L105 24 L110 32 L78 55 Z" fill="#e7aebb"/>
    <path d="M31 42 C8 35 8 70 31 64" fill="none" stroke="#e7aebb" stroke-width="8" stroke-linecap="round"/>
    <path d="M103 23 L114 30" fill="none" stroke="#e7aebb" stroke-width="8" stroke-linecap="round"/>
    <path d="M39 35 C43 20 66 20 71 35" fill="none" stroke="#f5d9df" stroke-width="6" stroke-linecap="round"/>
  </svg>
</button>

  </div>

</section>


<!-- 🐰 兔兔世界 -->

<section id="bunnyWorld" class="bunny-world">

  <button
    class="back-button"
    type="button"
    onclick="closeBunnyWorld()">‹</button>

  <div class="bunny-cloud cloud-one">☁</div>
  <div class="bunny-cloud cloud-two">☁</div>

  <div
    id="languageIndicator"
    class="language-indicator">
    中文
  </div>

  <div
    id="bunnyMessage"
    class="bunny-message">
  </div>

  <div
    id="bunnyScene"
    class="bunny-scene"
    onclick="bunnyBite()">

    <div class="big-bunny">🐰</div>

    <div class="carrot-area">
      <span
        id="carrot"
        class="carrot">🥕</span>
    </div>

    <div
      id="bunnyHeart"
      class="bunny-heart">💗</div>

  </div>

  <div class="bunny-ground"></div>

  <div class="tap-hint">
    tap ♡
  </div>

</section>


<script>

/* =========================
   ⭐ 星星
========================= */

const STAR_COUNT=20;
let specialStars=[];
let foundSpecial=0;

function openStarWorld(){
  document.getElementById("starWorld").classList.add("open");
  createStars();
}

function closeStarWorld(){
  document.getElementById("starWorld").classList.remove("open");
  document.getElementById("starField").innerHTML="";
  specialStars=[];
  foundSpecial=0;
}

function createStars(){

  const field=document.getElementById("starField");

  field.innerHTML="";
  specialStars=[];
  foundSpecial=0;

  const baseX=randomNumber(22,72);
  const baseY=randomNumber(25,70);

  const angle=Math.random()*Math.PI*2;
  const distance=randomNumber(8,13);

  let secondX=baseX+Math.cos(angle)*distance;
  let secondY=baseY+Math.sin(angle)*distance;

  secondX=Math.max(12,Math.min(88,secondX));
  secondY=Math.max(15,Math.min(82,secondY));

  const fang=createOneStar(baseX,baseY,true,"芳樑");
  const wen=createOneStar(secondX,secondY,true,"1WEN");

  specialStars=[fang,wen];

  for(let i=0;i<STAR_COUNT-2;i++){

    let x;
    let y;
    let attempts=0;

    do{
      x=randomNumber(8,92);
      y=randomNumber(12,88);
      attempts++;
    }
    while(tooCloseToSpecial(x,y)&&attempts<30);

    createOneStar(x,y,false,"");
  }
}

function createOneStar(x,y,special,name){

  const field=document.getElementById("starField");
  const star=document.createElement("button");

  star.type="button";
  star.className="sky-star";

  star.style.left=x+"%";
  star.style.top=y+"%";

  star.dataset.x=x;
  star.dataset.y=y;

  if(special){

    star.classList.add("special");
    star.dataset.name=name;

    star.addEventListener(
      "click",
      ()=>findSpecialStar(star)
    );

  }else{

    star.addEventListener(
      "click",
      ()=>revealNormalStar(star)
    );
  }

  field.appendChild(star);

  return star;
}

function revealNormalStar(star){

  if(star.classList.contains("revealed")){
    return;
  }

  star.classList.add("revealed");

  star.textContent=
    Math.random()<.5 ? "🐰" : "🌸";
}

function findSpecialStar(star){

  if(star.classList.contains("found")){
    return;
  }

  star.classList.add("found");

  const label=document.createElement("span");

  label.className="star-name";
  label.textContent=star.dataset.name;

  star.appendChild(label);

  foundSpecial++;

  if(foundSpecial===1){

    const other=
      specialStars.find(item=>item!==star);

    showHint(other);
  }

  if(foundSpecial===2){

    removeHint();
    connectSpecialStars();
  }
}

function showHint(target){

  removeHint();

  const hint=document.createElement("div");

  hint.className="hint-glow";
  hint.id="hintGlow";

  hint.style.left=target.dataset.x+"%";
  hint.style.top=target.dataset.y+"%";

  document
    .getElementById("starField")
    .appendChild(hint);
}

function removeHint(){

  const old=document.getElementById("hintGlow");

  if(old){
    old.remove();
  }
}

function connectSpecialStars(){

  const field=document.getElementById("starField");

  const first=specialStars[0];
  const second=specialStars[1];

  const rect=field.getBoundingClientRect();

  const x1=parseFloat(first.dataset.x)/100*rect.width;
  const y1=parseFloat(first.dataset.y)/100*rect.height;

  const x2=parseFloat(second.dataset.x)/100*rect.width;
  const y2=parseFloat(second.dataset.y)/100*rect.height;

  const dx=x2-x1;
  const dy=y2-y1;

  const length=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;

  const line=document.createElement("div");

  line.className="connection-line";
  line.style.left=x1+"px";
  line.style.top=y1+"px";
  line.style.width=length+"px";
  line.style.transform="rotate("+angle+"deg)";

  field.insertBefore(line,field.firstChild);

  requestAnimationFrame(()=>{
    line.classList.add("show");
  });
}

function tooCloseToSpecial(x,y){

  if(specialStars.length<2){
    return false;
  }

  return specialStars.some(star=>{

    const sx=parseFloat(star.dataset.x);
    const sy=parseFloat(star.dataset.y);

    const dx=x-sx;
    const dy=y-sy;

    return Math.sqrt(dx*dx+dy*dy)<9;
  });
}

function randomNumber(min,max){
  return Math.random()*(max-min)+min;
}


/* =========================
   🌷 花園
========================= */

function openGardenWorld(){
  document.getElementById("gardenWorld").classList.add("open");
}

function closeGardenWorld(){
  document.getElementById("gardenWorld").classList.remove("open");
}


/* 呼吸花 */

let breathingPaused=false;

function openBreathingGarden(){
  document.getElementById("breathingGarden").classList.add("open");
}

function closeBreathingGarden(){
  document.getElementById("breathingGarden").classList.remove("open");
}

function toggleBreathing(){

  const flower=document.getElementById("breathingFlower");
  const button=document.getElementById("pauseButton");

  breathingPaused=!breathingPaused;

  if(breathingPaused){

    flower.classList.add("paused");
    button.textContent="▶";

  }else{

    flower.classList.remove("paused");
    button.textContent="Ⅱ";
  }
}


/* 種花 */

let waterCount=0;
let chosenFlower="🌷";

const flowers=[
  "🌸",
  "🌻",
  "🌷",
  "🪻",
  "🌼",
  "🌹"
];

function openGrowingGarden(){

  document
    .getElementById("growingGarden")
    .classList.add("open");

  resetPlant();
}

function closeGrowingGarden(){

  document
    .getElementById("growingGarden")
    .classList.remove("open");
}

function resetPlant(){

  waterCount=0;

  chosenFlower=
    flowers[
      Math.floor(Math.random()*flowers.length)
    ];

  document
    .getElementById("sprout")
    .classList.remove("show");

  document
    .getElementById("stem")
    .classList.remove("show");

  const flower=
    document.getElementById("finalFlower");

  flower.classList.remove("show");
  flower.textContent="";

  createProgressDots();
}

function createProgressDots(){

  const progress=
    document.getElementById("growProgress");

  progress.innerHTML="";

  for(let i=0;i<15;i++){

    const dot=document.createElement("div");

    dot.className="progress-dot";

    progress.appendChild(dot);
  }
}

function waterPlant(){

  if(waterCount>=15){
    return;
  }

  waterCount++;

  showWaterDrop();
  updateProgress();

  if(waterCount===5){

    document
      .getElementById("sprout")
      .classList.add("show");
  }

  if(waterCount===10){

    document
      .getElementById("sprout")
      .classList.remove("show");

    document
      .getElementById("stem")
      .classList.add("show");
  }

  if(waterCount===15){

    const flower=
      document.getElementById("finalFlower");

    flower.textContent=chosenFlower;

    requestAnimationFrame(()=>{
      flower.classList.add("show");
    });
  }
}

function showWaterDrop(){

  const area=
    document.querySelector(".grow-area");

  const drop=
    document.createElement("div");

  drop.className="water-drop";
  drop.textContent="💧";

  area.appendChild(drop);

  setTimeout(()=>{
    drop.remove();
  },700);
}

function updateProgress(){

  const dots=
    document.querySelectorAll(
      "#growProgress .progress-dot"
    );

  dots.forEach((dot,index)=>{

    if(index<waterCount){
      dot.classList.add("done");
    }
  });
}


/* =========================
   🐰 兔兔世界
========================= */

const bunnyMessages={

  zh:[
    "慢慢",
    "我永遠在",
    "相信自己有無限可能",
    "停下來看看世界",
    "相信自己就是最棒的"
  ],

  ko:[
    "천천히 해도 괜찮아",
    "나는 언제나 네 곁에 있어",
    "너에게는 무한한 가능성이 있어",
    "잠시 멈춰 세상을 바라봐",
    "너 자신이 최고라는 걸 믿어"
  ],

  en:[
    "Take it slow.",
    "I will always be here.",
    "Believe in your infinite possibilities.",
    "Pause and look at the world.",
    "Believe that you are amazing."
  ]
};

const bunnyLanguages=["zh","ko","en"];

const bunnyLanguageNames={
  zh:"中文",
  ko:"한국어",
  en:"English"
};

let bunnyClickCount=0;


/* 打開兔兔 */

function openBunnyWorld(){

  document
    .getElementById("bunnyWorld")
    .classList.add("open");

  bunnyClickCount=0;

  const message=
    document.getElementById("bunnyMessage");

  message.textContent="";
  message.classList.remove("show");

  updateBunnyLanguage();
}


/* 返回首頁 */

function closeBunnyWorld(){

  document
    .getElementById("bunnyWorld")
    .classList.remove("open");
}


/* 兔兔咬一口 */

function bunnyBite(){

  const scene=
    document.getElementById("bunnyScene");

  const message=
    document.getElementById("bunnyMessage");

  /* 算目前語言 */

  const languageRound=
    Math.floor(bunnyClickCount/5)%3;

  const language=
    bunnyLanguages[languageRound];

  /* 算目前第幾句 */

  const messageIndex=
    bunnyClickCount%5;

  /* 顯示文字 */

  message.classList.remove("show");

  setTimeout(()=>{

    message.textContent=
      bunnyMessages[language][messageIndex];

    message.classList.add("show");

  },100);


  /* 咬紅蘿蔔動畫 */

  scene.classList.add("bite");

  setTimeout(()=>{
    scene.classList.remove("bite");
  },180);


  /* 小碎屑 */

  createCrumb();


  /* 愛心 */

  showBunnyHeart();


  bunnyClickCount++;


  /* 第五句之後切換語言 */

  if(bunnyClickCount%5===0){

    setTimeout(()=>{
      updateBunnyLanguage();
    },600);
  }
}


/* 顯示目前語言 */

function updateBunnyLanguage(){

  const languageRound=
    Math.floor(bunnyClickCount/5)%3;

  const language=
    bunnyLanguages[languageRound];

  document
    .getElementById("languageIndicator")
    .textContent=
      bunnyLanguageNames[language];
}


/* 紅蘿蔔碎屑 */

function createCrumb(){

  const scene=
    document.getElementById("bunnyScene");

  const crumb=
    document.createElement("div");

  crumb.className="crumb";

  crumb.textContent=
    Math.random()<.5 ? "🥕" : "✨";

  crumb.style.marginLeft=
    (Math.random()*20-10)+"px";

  scene.appendChild(crumb);

  setTimeout(()=>{
    crumb.remove();
  },700);
}


/* 愛心 */

function showBunnyHeart(){

  const heart=
    document.getElementById("bunnyHeart");

  heart.classList.remove("pop");

  void heart.offsetWidth;

  heart.classList.add("pop");
}

</script>

</body>
</html>
