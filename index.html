<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>1WEN's Garden</title>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:#06091e;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button{
  font-family:inherit;
}


/* =========================
   首頁
========================= */

.home{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;

  background-image:
    linear-gradient(
      rgba(5,8,25,.08),
      rgba(5,8,25,.30)
    ),
    url("./garden-home.png");

  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
}
/* 首頁隱藏入口 */
.home-hotspots{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.home-hotspot{
  position:absolute;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* 星空 → 星星世界 */
.hotspot-stars{
  left:0;
  top:0;
  width:100%;
  height:43%;
}

/* 小女孩 → 花花世界 */
.hotspot-girl{
  left:2%;
  top:49%;
  width:45%;
  height:46%;
}

/* 兔兔 → 兔兔世界 */
.hotspot-bunnies{
  left:55%;
  top:76%;
  width:43%;
  height:22%;
}
.worlds{
  position:absolute;
  z-index:10;

  left:50%;
  bottom:6vh;

  transform:translateX(-50%);

  width:min(90%,650px);

  display:flex;
  justify-content:space-around;
  gap:18px;
}

.world{
  width:clamp(85px,22vw,135px);
  aspect-ratio:1/1;

  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.30),
      rgba(20,25,55,.35) 60%,
      rgba(10,15,40,.45)
    );

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:0 8px 30px rgba(0,0,0,.4);

  transition:transform .2s;
}

.world:active{
  transform:scale(.92);
}

.icon{
  font-size:clamp(44px,11vw,70px);
}

.star-button{
  box-shadow:
    0 0 32px rgba(255,220,110,.30),
    0 8px 30px rgba(0,0,0,.4);
}

.garden-button{
  box-shadow:
    0 0 32px rgba(255,150,190,.25),
    0 8px 30px rgba(0,0,0,.4);
}

.bunny-button{
  box-shadow:
    0 0 32px rgba(255,255,255,.22),
    0 8px 30px rgba(0,0,0,.4);
}


/* =========================
   返回按鈕
========================= */

.back-button{
  position:absolute;
  z-index:200;

  top:max(18px,env(safe-area-inset-top));
  left:18px;

  width:46px;
  height:46px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;

  cursor:pointer;

  color:white;
  font-size:25px;

  background:rgba(15,20,50,.42);

  backdrop-filter:blur(8px);
}


/* =========================
   ⭐ 星星世界
========================= */

.star-world{
  position:fixed;
  inset:0;

  z-index:50;

  display:none;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 100%,
      #18275a 0%,
      transparent 48%
    ),
    radial-gradient(
      circle at 15% 20%,
      rgba(91,76,170,.32),
      transparent 35%
    ),
    linear-gradient(
      #06091e,
      #101637 55%,
      #080b20
    );
}

.star-world.open{
  display:block;
}

.star-world::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.8) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(170,190,255,.6) 1px,
      transparent 1.5px
    );

  background-size:
    72px 72px,
    113px 113px;

  background-position:
    10px 20px,
    40px 55px;

  opacity:.35;
}

#starField{
  position:absolute;
  inset:0;
}

.sky-star{
  position:absolute;

  width:54px;
  height:54px;

  transform:translate(-50%,-50%);

  border:0;
  background:transparent;

  cursor:pointer;
  touch-action:manipulation;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#ffe48a;
  font-size:26px;

  text-shadow:
    0 0 7px rgba(255,230,130,.95),
    0 0 18px rgba(255,205,80,.65);
}

.sky-star::before{
  content:"✦";
}

.sky-star:nth-child(3n){
  font-size:20px;
}

.sky-star:nth-child(4n){
  font-size:31px;
}

.sky-star.revealed::before{
  content:"";
}

.sky-star.revealed{
  font-size:27px;
}

.sky-star.special.found{
  color:#fff0a8;

  filter:
    drop-shadow(0 0 8px #ffd66b)
    drop-shadow(0 0 20px #ffbf45);

  animation:specialGlow 2.2s ease-in-out infinite;
}

.star-name{
  position:absolute;

  top:42px;
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  color:#fff1bd;

  font-size:15px;
  font-weight:bold;
}

@keyframes specialGlow{

  0%,100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.22);
  }
}

.hint-glow{
  position:absolute;

  width:85px;
  height:85px;

  border-radius:50%;

  transform:translate(-50%,-50%);

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(255,215,100,.28),
      rgba(255,190,70,.08) 45%,
      transparent 70%
    );

  opacity:0;

  animation:hintPulse 3s ease-in-out infinite;
}

@keyframes hintPulse{

  0%,60%,100%{
    opacity:0;
  }

  75%{
    opacity:.85;
  }
}

.connection-line{
  position:absolute;

  height:2px;

  transform-origin:left center;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(255,215,110,.15),
      rgba(255,230,150,.75),
      rgba(255,215,110,.15)
    );

  box-shadow:
    0 0 10px rgba(255,215,100,.55);

  opacity:0;

  transition:opacity 1s;
}

.connection-line.show{
  opacity:1;
}


/* =========================
   🌷 花園首頁
========================= */

.garden-world{
  position:fixed;
  inset:0;

  z-index:60;

  display:none;
  overflow:hidden;

  color:#68585d;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.9),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(255,221,230,.65),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #fff8ef 0%,
      #fceeea 58%,
      #e6efd9 100%
    );
}

.garden-world.open{
  display:block;
}

.garden-world .back-button,
.garden-room .back-button,
.flower-book .back-button{

  color:#806b72;

  background:rgba(255,255,255,.60);

  border-color:
    rgba(120,90,100,.15);
}

.garden-title{
  position:absolute;

  top:13%;
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  font-family:Georgia,serif;

  font-size:
    clamp(28px,6vw,46px);

  font-weight:normal;

  color:#806c72;
}
/* 已種植的收藏花園：正式版 */
.collected-garden{
  position:absolute;
  left:3%;
  right:3%;
  top:54%;
  bottom:3%;
  z-index:6;
  pointer-events:none;
}

.flower-patch{
  position:absolute;
  width:42px;
  height:62px;
  transform:translate(-50%,-100%);
}

.garden-bloom{
  position:absolute;
  left:0;
  bottom:0;
  width:42px;
  height:62px;
}

.garden-bloom-flower{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  font-size:27px;
  line-height:1;
  z-index:4;
  filter:drop-shadow(0 2px 2px rgba(90,70,50,.10));
}

.garden-bloom-stem{
  position:absolute;
  left:50%;
  top:23px;
  width:4px;
  height:29px;
  transform:translateX(-50%);
  background:#6fa85b;
  border-radius:4px;
  z-index:2;
}

.garden-bloom-leaf{
  position:absolute;
  top:34px;
  width:14px;
  height:8px;
  background:#78b967;
  z-index:3;
}

.garden-bloom-leaf.left{
  left:6px;
  border-radius:100% 0 100% 0;
  transform:rotate(18deg);
}

.garden-bloom-leaf.right{
  right:6px;
  border-radius:0 100% 0 100%;
  transform:rotate(-18deg);
}

.garden-bloom-soil{
  position:absolute;
  left:50%;
  bottom:0;
  width:34px;
  height:8px;
  transform:translateX(-50%);
  background:#9c765f;
  border-radius:50%;
  z-index:1;
}

/* 收藏花朵保持小巧，不蓋住中央正在種植的植物 */
.garden-bloom.lavender .garden-bloom-flower{font-size:25px;}
.garden-bloom.sunflower .garden-bloom-flower{font-size:25px;}
.garden-bloom.rose .garden-bloom-flower{font-size:26px;}

  .garden-choices{
  position:absolute;

  left:50%;
  top:49%;

  transform:
    translate(-50%,-50%);

  width:min(92%,700px);

  display:flex;
  justify-content:center;
  gap:clamp(15px,5vw,45px);
}

.garden-choice{
  width:clamp(105px,28vw,175px);
  aspect-ratio:1/1;

  border:none;
  border-radius:50%;

  cursor:pointer;
  touch-action:manipulation;

  background:
    rgba(255,255,255,.58);

  box-shadow:
    0 12px 35px rgba(130,100,100,.12),
    inset 0 0 25px rgba(255,255,255,.65);

  font-size:
    clamp(50px,12vw,82px);
}

.garden-grass{
  position:absolute;

  bottom:-5%;
  left:-5%;

  width:110%;
  height:25%;

  border-radius:
    50% 50% 0 0;

  background:
    rgba(182,207,153,.32);
}


/* =========================
   🌸 呼吸花
========================= */

.garden-room{
  position:fixed;
  inset:0;

  z-index:70;

  display:none;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.95),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #fff9f2,
      #f9e9e7 62%,
      #e9f0df
    );
}

.garden-room.open{
  display:block;
}

.breathe-text{
  position:absolute;

  top:18%;

  width:100%;

  text-align:center;

  font-family:Georgia,serif;

  font-size:
    clamp(22px,5vw,34px);

  color:#806a72;
}

.breathing-flower{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:
    clamp(110px,28vw,190px);

  filter:
    drop-shadow(
      0 12px 20px
      rgba(160,100,120,.15)
    );

  animation:
    breatheFlower
    7s ease-in-out infinite;
}

@keyframes breatheFlower{

  0%{
    transform:
      translate(-50%,-50%)
      scale(.78);

    opacity:.82;
  }

  43%{
    transform:
      translate(-50%,-50%)
      scale(1.12);

    opacity:1;
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(.78);

    opacity:.82;
  }
}


/* =========================
   🌱 新版種花世界
========================= */

.growing-room{
  background:
    linear-gradient(
      180deg,
      #fcefdc 0%,
      #f7e6cf 52%,
      #dce9c6 53%,
      #bfd59f 100%
    );
}


/* 太陽 */

.garden-sun{
  position:absolute;

  top:9%;
  right:10%;

  width:75px;
  height:75px;

  border-radius:50%;

  background:
    rgba(255,220,133,.65);

  box-shadow:
    0 0 40px
    rgba(255,213,120,.45);
}


/* 雲 */

.garden-cloud{
  position:absolute;

  color:
    rgba(255,255,255,.72);

  font-size:75px;

  pointer-events:none;
}

.cloud-a{
  top:13%;
  left:-100px;

  animation:
    cloudMoveOne
    34s linear infinite;
}

.cloud-b{
  top:25%;
  left:-140px;

  font-size:55px;

  opacity:.7;

  animation:
    cloudMoveTwo
    47s linear infinite;
}

@keyframes cloudMoveOne{

  from{
    left:-120px;
  }

  to{
    left:110%;
  }
}

@keyframes cloudMoveTwo{

  from{
    left:-150px;
  }

  to{
    left:110%;
  }
}


/* 蝴蝶 */

.butterfly{
  position:absolute;

  z-index:5;

  top:35%;
  left:-60px;

  font-size:28px;

  pointer-events:none;

  animation:
    butterflyFly
    18s ease-in-out infinite;
}

@keyframes butterflyFly{

  0%{
    left:-60px;
    top:40%;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  30%{
    top:31%;
  }

  55%{
    top:42%;
  }

  80%{
    top:28%;
  }

  92%{
    opacity:1;
  }

  100%{
    left:110%;
    top:36%;
    opacity:0;
  }
}


/* 更多蝴蝶：不同高度、速度與延遲 */
.butterfly.b2{animation-duration:23s;animation-delay:-7s;font-size:23px;}
.butterfly.b3{animation-duration:29s;animation-delay:-15s;font-size:20px;}
.butterfly.b4{animation-duration:21s;animation-delay:-3s;font-size:25px;}
.butterfly.b2{filter:hue-rotate(35deg);}
.butterfly.b3{filter:hue-rotate(90deg);}
.butterfly.b4{filter:hue-rotate(155deg);}

/* 草地 */

.garden-field{
  position:absolute;

  left:-5%;
  bottom:-5%;

  width:110%;
  height:38%;

  border-radius:
    48% 48% 0 0;

  background:
    linear-gradient(
      #c7dda9,
      #a9c985
    );
}


/* 小草裝飾 */

.grass-decoration{
  position:absolute;

  bottom:12%;

  font-size:36px;

  opacity:.65;
}

.grass-one{
  left:7%;
}

.grass-two{
  right:8%;
}

.grass-three{
  left:20%;
  bottom:5%;
}


/* 石頭 */

.rock{
  position:absolute;

  width:48px;
  height:25px;

  border-radius:
    50% 55% 35% 40%;

  background:#b7aa9b;

  opacity:.6;
}

.rock-one{
  bottom:12%;
  left:12%;
}

.rock-two{
  bottom:7%;
  right:15%;

  transform:scale(.7);
}


/* 木牌 */

.garden-sign{
  position:absolute;

  z-index:5;

  left:8%;
  bottom:22%;

  padding:10px 15px;

  border-radius:5px;

  color:#76543d;

  background:#d8ad79;

  box-shadow:
    0 5px 10px
    rgba(80,60,40,.12);

  font-family:Georgia,serif;

  font-size:
    clamp(13px,3vw,18px);

  transform:rotate(-4deg);
}

.garden-sign::after{
  content:"";

  position:absolute;

  left:50%;
  top:100%;

  width:7px;
  height:48px;

  transform:
    translateX(-50%);

  background:#a77d55;
}


/* 種植主要區域 */

.grow-area{
  position:absolute;

  z-index:10;

  left:50%;
  top:55%;

  transform:
    translate(-50%,-50%);

  width:min(94%,520px);
  height:520px;
}


/* 澆花器 */

.water-button{
  position:absolute;

  z-index:30;

  left:50%;
  top:15px;

  transform:
    translateX(-50%);

  width:94px;
  height:82px;

  border:none;
  border-radius:24px;

  cursor:pointer;
  touch-action:manipulation;

  background:
    rgba(255,255,255,.55);

  box-shadow:
    0 8px 24px
    rgba(120,90,90,.10);

  transition:
    transform .15s ease;
}

.water-button:active{
  transform:
    translateX(-50%)
    rotate(-15deg)
    scale(.95);
}

.water-button svg{
  width:72px;
  height:58px;
}


/* 水滴 */

.water-drop{
  position:absolute;

  z-index:25;

  left:58%;
  top:85px;

  font-size:25px;

  pointer-events:none;

  animation:
    waterFall
    .85s ease-in forwards;
}

@keyframes waterFall{

  0%{
    opacity:1;

    transform:
      translateY(0)
      scale(.8);
  }

  80%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translateY(180px)
      scale(1.05);
  }
}


/* 植物區 */

.grow-display{
  position:absolute;

  left:50%;
  bottom:50px;

  transform:
    translateX(-50%);

  width:260px;
  height:330px;
}

.plant{
  position:absolute;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:210px;
  height:310px;
}


/* 土 */

.soil{
  position:absolute;

  z-index:5;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:190px;
  height:48px;

  border-radius:50%;

  background:
    linear-gradient(
      #a8785f,
      #8d634e
    );

  box-shadow:
    inset 0 5px 8px
    rgba(255,255,255,.12);
}


/* 種子 */

.seed{
  position:absolute;

  z-index:6;

  left:50%;
  bottom:36px;

  transform:
    translateX(-50%);

  width:14px;
  height:10px;

  border-radius:50%;

  background:#76533f;

  transition:
    opacity .35s;
}


/* 莖 */

.dynamic-stem{
  position:absolute;

  z-index:4;

  left:50%;
  bottom:40px;

  transform:
    translateX(-50%);

  width:7px;
  height:0;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #6c9c5d,
      #8db979
    );

  transition:
    height .45s ease,
    width .45s ease;
}


/* 葉子 */

.leaf{
  position:absolute;

  z-index:7;

  width:0;
  height:0;

  opacity:0;

  background:#82ad6c;

  transition:
    width .4s ease,
    height .4s ease,
    opacity .4s ease,
    bottom .4s ease;
}

.leaf.left{
  right:50%;

  border-radius:
    100% 0 100% 0;

  transform:
    rotate(10deg);
}

.leaf.right{
  left:50%;

  border-radius:
    0 100% 0 100%;

  transform:
    rotate(-10deg);
}


/* 花苞 */

.flower-bud{
  position:absolute;

  z-index:8;

  left:50%;

  bottom:55px;

  transform:
    translateX(-50%)
    scale(0);

  font-size:32px;

  opacity:0;

  transition:
    bottom .45s ease,
    transform .45s ease,
    opacity .45s ease;
}


/* 最終花 */

.final-flower{
  position:absolute;

  z-index:20;

  left:50%;

  bottom:210px;

  transform:
    translateX(-50%)
    scale(0);

  font-size:90px;

  opacity:0;

  filter:
    drop-shadow(
      0 8px 12px
      rgba(130,80,80,.16)
    );

  transition:
    transform .8s
    cubic-bezier(.2,1.6,.4,1),
    opacity .5s;
}

.final-flower.show{
  transform:
    translateX(-50%)
    scale(1);

  opacity:1;
}


/* 開花提示 */

.bloom-message{
  position:absolute;

  z-index:50;

  left:50%;
  bottom:12px;

  transform:
    translateX(-50%)
    translateY(10px);

  width:90%;

  text-align:center;

  color:#725d62;

  font-size:18px;

  font-weight:bold;

  opacity:0;

  transition:
    opacity .5s,
    transform .5s;
}

.bloom-message.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* 再種一朵 */

.plant-again{
  position:absolute;

  z-index:60;

  right:15px;
  bottom:18px;

  display:none;

  padding:10px 15px;

  border:none;
  border-radius:20px;

  cursor:pointer;

  color:#745d62;

  background:
    rgba(255,255,255,.70);

  box-shadow:
    0 5px 15px
    rgba(100,80,80,.10);
}

.plant-again.show{
  display:block;
}


/* =========================
   📖 花冊
========================= */

.flower-book{

<script>

/* =========================
   ⭐ 星星世界
========================= */

const STAR_COUNT=20;

let specialStars=[];
let foundSpecial=0;


function openStarWorld(){

  document
    .getElementById("starWorld")
    .classList.add("open");

  createStars();
}


function closeStarWorld(){

  document
    .getElementById("starWorld")
    .classList.remove("open");

  document
    .getElementById("starField")
    .innerHTML="";

  specialStars=[];
  foundSpecial=0;
}


function createStars(){

  const field=
    document.getElementById(
      "starField"
    );

  field.innerHTML="";

  specialStars=[];
  foundSpecial=0;


  const baseX=
    randomNumber(22,72);

  const baseY=
    randomNumber(25,70);


  const angle=
    Math.random()
    *Math.PI*2;

  const distance=
    randomNumber(8,13);


  let secondX=
    baseX+
    Math.cos(angle)*distance;

  let secondY=
    baseY+
    Math.sin(angle)*distance;


  secondX=
    Math.max(
      12,
      Math.min(88,secondX)
    );

  secondY=
    Math.max(
      15,
      Math.min(82,secondY)
    );


  const fang=
    createOneStar(
      baseX,
      baseY,
      true,
      "芳樑"
    );

  const wen=
    createOneStar(
      secondX,
      secondY,
      true,
      "1WEN"
    );

  specialStars=[
    fang,
    wen
  ];


  for(
    let i=0;
    i<STAR_COUNT-2;
    i++
  ){

    let x;
    let y;

    let attempts=0;

    do{

      x=randomNumber(8,92);
      y=randomNumber(12,88);

      attempts++;

    }while(
      tooCloseToSpecial(x,y)
      &&
      attempts<30
    );

    createOneStar(
      x,
      y,
      false,
      ""
    );
  }
}


function createOneStar(
  x,
  y,
  special,
  name
){

  const field=
    document.getElementById(
      "starField"
    );

  const star=
    document.createElement(
      "button"
    );


  star.type="button";

  star.className=
    "sky-star";

  star.style.left=
    x+"%";

  star.style.top=
    y+"%";

  star.dataset.x=x;
  star.dataset.y=y;


  if(special){

    star.classList.add(
      "special"
    );

    star.dataset.name=name;

    star.addEventListener(
      "click",
      ()=>{
        findSpecialStar(star);
      }
    );

  }else{

    star.addEventListener(
      "click",
      ()=>{
        revealNormalStar(star);
      }
    );
  }


  field.appendChild(star);

  return star;
}


function revealNormalStar(star){

  if(
    star.classList.contains(
      "revealed"
    )
  ){
    return;
  }

  star.classList.add(
    "revealed"
  );

  star.textContent=
    Math.random()<.5
    ?
    "🐰"
    :
    "🌸";
}


function findSpecialStar(star){

  if(
    star.classList.contains(
      "found"
    )
  ){
    return;
  }


  star.classList.add(
    "found"
  );


  const label=
    document.createElement(
      "span"
    );

  label.className=
    "star-name";

  label.textContent=
    star.dataset.name;

  star.appendChild(label);


  foundSpecial++;


  if(foundSpecial===1){

    const other=
      specialStars.find(
        item=>item!==star
      );

    showHint(other);
  }


  if(foundSpecial===2){

    removeHint();

    connectSpecialStars();
  }
}


function showHint(target){

  removeHint();


  const hint=
    document.createElement(
      "div"
    );

  hint.className=
    "hint-glow";

  hint.id=
    "hintGlow";

  hint.style.left=
    target.dataset.x+"%";

  hint.style.top=
    target.dataset.y+"%";


  document
    .getElementById(
      "starField"
    )
    .appendChild(hint);
}


function removeHint(){

  const old=
    document.getElementById(
      "hintGlow"
    );

  if(old){
    old.remove();
  }
}


function connectSpecialStars(){

  const field=
    document.getElementById(
      "starField"
    );

  const first=
    specialStars[0];

  const second=
    specialStars[1];

  const rect=
    field.getBoundingClientRect();


  const x1=
    parseFloat(
      first.dataset.x
    )
    /100
    *rect.width;

  const y1=
    parseFloat(
      first.dataset.y
    )
    /100
    *rect.height;


  const x2=
    parseFloat(
      second.dataset.x
    )
    /100
    *rect.width;

  const y2=
    parseFloat(
      second.dataset.y
    )
    /100
    *rect.height;


  const dx=x2-x1;
  const dy=y2-y1;


  const length=
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  const angle=
    Math.atan2(
      dy,
      dx
    )
    *180
    /Math.PI;


  const line=
    document.createElement(
      "div"
    );

  line.className=
    "connection-line";

  line.style.left=
    x1+"px";

  line.style.top=
    y1+"px";

  line.style.width=
    length+"px";

  line.style.transform=
    "rotate("
    +angle+
    "deg)";


  field.insertBefore(
    line,
    field.firstChild
  );


  requestAnimationFrame(
    ()=>{
      line.classList.add(
        "show"
      );
    }
  );
}


function tooCloseToSpecial(x,y){

  if(
    specialStars.length<2
  ){
    return false;
  }


  return specialStars.some(
    star=>{

      const sx=
        parseFloat(
          star.dataset.x
        );

      const sy=
        parseFloat(
          star.dataset.y
        );

      const dx=x-sx;
      const dy=y-sy;

      return(
        Math.sqrt(
          dx*dx+
          dy*dy
        )
        <9
      );
    }
  );
}


function randomNumber(min,max){

  return(
    Math.random()
    *(max-min)
    +min
  );
}



/* =========================
   🌷 花園首頁
========================= */

function openGardenWorld(){

  document
    .getElementById(
      "gardenWorld"
    )

      "open"
    );
    renderCollectedGarden();

/* =========================
   🌸 呼吸花
========================= */

function openBreathingGarden(){

/* =========================

========================= */

const SAVE_KEY=
  "1wenFlowerBookV1";


function newFlowerSave(){

  return{

    sakura:0,
    sunflower:0,
    rose:0,
    lavender:0,
    daisy:0,
    tulip:0,
    hibiscus:0,

    roseUnlocked:false
  };
}


function loadFlowerSave(){

  try{

    const saved=
      localStorage.getItem(
        SAVE_KEY
      );

    if(!saved){
      return newFlowerSave();
    }

    return Object.assign(
      newFlowerSave(),
      JSON.parse(saved)
    );

  }catch(error){

    return newFlowerSave();
  }
}


let flowerSave=
  loadFlowerSave();


function saveFlowerBook(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(
        flowerSave
      )
    );

  }catch(error){

    console.log(
      "Flower save unavailable"
    );
  }
}



/* =========================
   選擇下一朵花
========================= */

function allNormalTargetsComplete(){

  return flowerData
    .filter(
      flower=>!flower.secret
    )
    .every(
      flower=>
        flowerSave[flower.id]
        >=
        flower.target
    );
}


function chooseNextFlower(){

  /*
    六種普通花全部達標後，
    如果玫瑰還沒出現，
    下一株一定是玫瑰。
  */

  if(
    allNormalTargetsComplete()
    &&
    !flowerSave.roseUnlocked
  ){

    return flowerData.find(
      flower=>
        flower.id==="rose"
    );
  }


  /*
    尚未完成花冊時，
    優先從「還沒達標」
    的花裡隨機。

    這可以確保：
    🌸 5
    🌻 2
    🪻 1
    🌼 3
    🌷 1
    🌺 4

    最終一定能完成。
  */

  const unfinished=
    flowerData.filter(
      flower=>
        !flower.secret
        &&
        flowerSave[flower.id]
        <
        flower.target
    );


  if(unfinished.length>0){

    return unfinished[
      Math.floor(
        Math.random()
        *unfinished.length
      )
    ];
  }


  /*
    花冊完成後，
    六種普通花仍然
    可以繼續隨機種。
  */

  const normalFlowers=
    flowerData.filter(
      flower=>
        !flower.secret
    );


  return normalFlowers[
    Math.floor(
      Math.random()
      *normalFlowers.length
    )
  ];
}

function growPlantStage(stage){

  const stem=
    document.getElementById(
      "dynamicStem"
    );

  const seed=
    document.getElementById(
      "seed"
    );

  const bud=
    document.getElementById(
      "flowerBud"
    );


  /*
    1～3：
    剛發芽
  */

  if(stage===1){

    stem.style.height=
      "14px";
  }


  if(stage===2){

    stem.style.height=
      "28px";

    seed.style.opacity=
      ".7";
  }


  if(stage===3){

    stem.style.height=
      "43px";

    seed.style.opacity=
      "0";
  }


  /*
    4～6：
    第一、第二片葉子
  */

  if(stage===4){

    stem.style.height=
      "60px";

    showLeaf(
      "leaf1",
      52,
      25,
      14
    );
  }


  if(stage===5){

    stem.style.height=
      "76px";

    showLeaf(
      "leaf1",
      60,
      34,
      18
    );
  }


  if(stage===6){

    stem.style.height=
      "92px";

    showLeaf(
      "leaf2",
      72,
      28,
      15
    );
  }


  /*
    7～9：
    莖變高、葉子增加
  */

  if(stage===7){

    stem.style.height=
      "110px";

    showLeaf(
      "leaf2",
      82,
      38,
      20
    );
  }


  if(stage===8){

    stem.style.height=
      "128px";

    showLeaf(
      "leaf3",
      100,
      30,
      16
    );
  }


  if(stage===9){

    stem.style.height=
      "145px";

    showLeaf(
      "leaf3",
      110,
      42,
      21
    );
  }


  /*
    10～11：
    最後一片葉子
  */

  if(stage===10){

    stem.style.height=
      "162px";

    showLeaf(
      "leaf4",
      130,
      32,
      17
    );
  }


  if(stage===11){

    stem.style.height=
      "178px";

    showLeaf(
      "leaf4",
      140,
      43,
      22
    );

    stem.style.width=
      "8px";
  }


  /*
    12：
    花苞出現
  */

  if(stage===12){

    stem.style.height=
      "190px";

    bud.style.bottom=
      "222px";

    bud.style.opacity=
      "1";

    bud.style.transform=
      "translateX(-50%) scale(.55)";

    bud.textContent=
      "🌱";
  }


  /*
    13：
    花苞變大
  */

  if(stage===13){

    stem.style.height=
      "200px";

    bud.style.bottom=
      "232px";

    bud.style.transform=
      "translateX(-50%) scale(.75)";

    bud.textContent=
      "🌿";
  }


  /*
    14：
    即將開花
  */

  if(stage===14){

    stem.style.height=
      "210px";

    bud.style.bottom=
      "242px";

    bud.style.transform=
      "translateX(-50%) scale(.95)";

    bud.textContent=
      "✨";
  }


  /*
    15：
    花苞消失，
    準備正式綻放
  */

  if(stage===15){

    stem.style.height=
      "215px";

    bud.style.opacity=
      "0";

    bud.style.transform=
      "translateX(-50%) scale(0)";
  }
}

        if(flower.secret){

/* =========================
   🌷 草地收藏花園（正式版）
   前 16 朵依 5 / 2 / 1 / 3 / 1 / 4 固定排列；
   隱藏玫瑰有專屬位置；超過目標後才使用隨機空位。
========================= */

const collectedFlowerSlots={
  sakura:[
    [10,38],[14,34],[18,39],[22,33],[26,38]
  ],
  sunflower:[
    [31,72],[35,68]
  ],
  lavender:[
    [39,35]
  ],
  daisy:[
    [67,35],[71,31],[75,37]
  ],
  tulip:[
    [79,70]
  ],
  hibiscus:[
    [84,38],[88,33],[92,38],[96,32]
  ],
  rose:[
    [62,66]
  ]
};

function createCollectedBloom(flower,x,y,extra=false){
  const patch=document.createElement("div");
  patch.className="flower-patch"+(extra?" extra-flower":"");
  patch.style.left=x+"%";
  patch.style.top=y+"%";

  const bloom=document.createElement("div");
  bloom.className="garden-bloom "+flower.id;

  const flowerHead=document.createElement("div");
  flowerHead.className="garden-bloom-flower";
  flowerHead.textContent=flower.emoji;

  const stem=document.createElement("div");
  stem.className="garden-bloom-stem";

  const leafLeft=document.createElement("div");
  leafLeft.className="garden-bloom-leaf left";

  const leafRight=document.createElement("div");
  leafRight.className="garden-bloom-leaf right";

  const soil=document.createElement("div");
  soil.className="garden-bloom-soil";

  bloom.appendChild(stem);
  bloom.appendChild(leafLeft);
  bloom.appendChild(leafRight);
  bloom.appendChild(soil);
  bloom.appendChild(flowerHead);
  patch.appendChild(bloom);

  return patch;
}

function stableRandomPosition(seed){
  /* 每一朵額外花的位置固定，不會每次進畫面亂跳 */
  const x=8+((seed*37)%86);
  const y=30+((seed*53)%48);

  /* 中央留給正在種植的大花，避免重疊 */
  if(x>42 && x<61 && y>48){
    return {x:x+22,y:y-12};
  }
  return {x,y};
}

function renderCollectedGarden(){
  const garden=document.getElementById("collectedGarden");
  if(!garden) return;

  garden.innerHTML="";
  let extraSeed=1;

  flowerData.forEach(flower=>{
    const count=flowerSave[flower.id] || 0;
    if(count<=0) return;
    if(flower.secret && !flowerSave.roseUnlocked) return;

    const slots=collectedFlowerSlots[flower.id] || [];
    const fixedLimit=flower.secret ? 1 : flower.target;
    const fixedCount=Math.min(count,fixedLimit,slots.length);

    for(let i=0;i<fixedCount;i++){
      const [x,y]=slots[i];
      garden.appendChild(createCollectedBloom(flower,x,y));
    }

    /* 目標完成後若繼續種到同種花，才增加隨機位置 */
    const extraCount=Math.max(0,count-fixedLimit);
    for(let i=0;i<extraCount;i++){
      const pos=stableRandomPosition(extraSeed*11+i*7+flower.id.length*13);
      garden.appendChild(createCollectedBloom(flower,pos.x,pos.y,true));
    }

    extraSeed+=17;
  });
}
