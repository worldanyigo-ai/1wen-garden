<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>1WEN's Garden</title>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:#06091e;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button{
  font-family:inherit;
}


/* =========================
   首頁
========================= */

.home{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;

  background-image:
    linear-gradient(
      rgba(5,8,25,.08),
      rgba(5,8,25,.30)
    ),
    url("./garden-home.png");

  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
}
/* 首頁隱藏入口 */
.home-hotspots{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.home-hotspot{
  position:absolute;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* 星空 → 星星世界 */
.hotspot-stars{
  left:0;
  top:0;
  width:100%;
  height:43%;
}

/* 小女孩 → 花花世界 */
.hotspot-girl{
  left:2%;
  top:49%;
  width:45%;
  height:46%;
}

/* 兔兔 → 兔兔世界 */
.hotspot-bunnies{
  left:55%;
  top:76%;
  width:43%;
  height:22%;
}
.worlds{
  position:absolute;
  z-index:10;

  left:50%;
  bottom:6vh;

  transform:translateX(-50%);

  width:min(90%,650px);

  display:flex;
  justify-content:space-around;
  gap:18px;
}

.world{
  width:clamp(85px,22vw,135px);
  aspect-ratio:1/1;

  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.30),
      rgba(20,25,55,.35) 60%,
      rgba(10,15,40,.45)
    );

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:0 8px 30px rgba(0,0,0,.4);

  transition:transform .2s;
}

.world:active{
  transform:scale(.92);
}

.icon{
  font-size:clamp(44px,11vw,70px);
}

.star-button{
  box-shadow:
    0 0 32px rgba(255,220,110,.30),
    0 8px 30px rgba(0,0,0,.4);
}

.garden-button{
  box-shadow:
    0 0 32px rgba(255,150,190,.25),
    0 8px 30px rgba(0,0,0,.4);
}

.bunny-button{
  box-shadow:
    0 0 32px rgba(255,255,255,.22),
    0 8px 30px rgba(0,0,0,.4);
}


/* =========================
   返回按鈕
========================= */

.back-button{
  position:absolute;
  z-index:200;

  top:max(18px,env(safe-area-inset-top));
  left:18px;

  width:46px;
  height:46px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;

  cursor:pointer;

  color:white;
  font-size:25px;

  background:rgba(15,20,50,.42);

  backdrop-filter:blur(8px);
}


/* =========================
   ⭐ 星星世界
========================= */

.star-world{
  position:fixed;
  inset:0;

  z-index:50;

  display:none;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 100%,
      #18275a 0%,
      transparent 48%
    ),
    radial-gradient(
      circle at 15% 20%,
      rgba(91,76,170,.32),
      transparent 35%
    ),
    linear-gradient(
      #06091e,
      #101637 55%,
      #080b20
    );
}

.star-world.open{
  display:block;
}

.star-world::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.8) 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle,
      rgba(170,190,255,.6) 1px,
      transparent 1.5px
    );

  background-size:
    72px 72px,
    113px 113px;

  background-position:
    10px 20px,
    40px 55px;

  opacity:.35;
}

#starField{
  position:absolute;
  inset:0;
}

.sky-star{
  position:absolute;

  width:54px;
  height:54px;

  transform:translate(-50%,-50%);

  border:0;
  background:transparent;

  cursor:pointer;
  touch-action:manipulation;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#ffe48a;
  font-size:26px;

  text-shadow:
    0 0 7px rgba(255,230,130,.95),
    0 0 18px rgba(255,205,80,.65);
}

.sky-star::before{
  content:"✦";
}

.sky-star:nth-child(3n){
  font-size:20px;
}

.sky-star:nth-child(4n){
  font-size:31px;
}

.sky-star.revealed::before{
  content:"";
}

.sky-star.revealed{
  font-size:27px;
}

.sky-star.special.found{
  color:#fff0a8;

  filter:
    drop-shadow(0 0 8px #ffd66b)
    drop-shadow(0 0 20px #ffbf45);

  animation:specialGlow 2.2s ease-in-out infinite;
}

.star-name{
  position:absolute;

  top:42px;
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  color:#fff1bd;

  font-size:15px;
  font-weight:bold;
}

@keyframes specialGlow{

  0%,100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.22);
  }
}

.hint-glow{
  position:absolute;

  width:85px;
  height:85px;

  border-radius:50%;

  transform:translate(-50%,-50%);

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(255,215,100,.28),
      rgba(255,190,70,.08) 45%,
      transparent 70%
    );

  opacity:0;

  animation:hintPulse 3s ease-in-out infinite;
}

@keyframes hintPulse{

  0%,60%,100%{
    opacity:0;
  }

  75%{
    opacity:.85;
  }
}

.connection-line{
  position:absolute;

  height:2px;

  transform-origin:left center;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(255,215,110,.15),
      rgba(255,230,150,.75),
      rgba(255,215,110,.15)
    );

  box-shadow:
    0 0 10px rgba(255,215,100,.55);

  opacity:0;

  transition:opacity 1s;
}

.connection-line.show{
  opacity:1;
}


/* =========================
   🌷 花園首頁
========================= */

.garden-world{
  position:fixed;
  inset:0;

  z-index:60;

  display:none;
  overflow:hidden;

  color:#68585d;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.9),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(255,221,230,.65),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #fff8ef 0%,
      #fceeea 58%,
      #e6efd9 100%
    );
}

.garden-world.open{
  display:block;
}

.garden-world .back-button,
.garden-room .back-button,
.flower-book .back-button{

  color:#806b72;

  background:rgba(255,255,255,.60);

  border-color:
    rgba(120,90,100,.15);
}

.garden-title{
  position:absolute;

  top:13%;
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  font-family:Georgia,serif;

  font-size:
    clamp(28px,6vw,46px);

  font-weight:normal;

  color:#806c72;
}
/* 已種植的收藏花園：正式版 */
.collected-garden{
  position:absolute;
  left:3%;
  right:3%;
  top:54%;
  bottom:3%;
  z-index:6;
  pointer-events:none;
}

.flower-patch{
  position:absolute;
  width:42px;
  height:62px;
  transform:translate(-50%,-100%);
}

.garden-bloom{
  position:absolute;
  left:0;
  bottom:0;
  width:42px;
  height:62px;
}

.garden-bloom-flower{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  font-size:27px;
  line-height:1;
  z-index:4;
  filter:drop-shadow(0 2px 2px rgba(90,70,50,.10));
}

.garden-bloom-stem{
  position:absolute;
  left:50%;
  top:23px;
  width:4px;
  height:29px;
  transform:translateX(-50%);
  background:#6fa85b;
  border-radius:4px;
  z-index:2;
}

.garden-bloom-leaf{
  position:absolute;
  top:34px;
  width:14px;
  height:8px;
  background:#78b967;
  z-index:3;
}

.garden-bloom-leaf.left{
  left:6px;
  border-radius:100% 0 100% 0;
  transform:rotate(18deg);
}

.garden-bloom-leaf.right{
  right:6px;
  border-radius:0 100% 0 100%;
  transform:rotate(-18deg);
}

.garden-bloom-soil{
  position:absolute;
  left:50%;
  bottom:0;
  width:34px;
  height:8px;
  transform:translateX(-50%);
  background:#9c765f;
  border-radius:50%;
  z-index:1;
}

/* 收藏花朵保持小巧，不蓋住中央正在種植的植物 */
.garden-bloom.lavender .garden-bloom-flower{font-size:25px;}
.garden-bloom.sunflower .garden-bloom-flower{font-size:25px;}
.garden-bloom.rose .garden-bloom-flower{font-size:26px;}

  .garden-choices{
  position:absolute;

  left:50%;
  top:49%;

  transform:
    translate(-50%,-50%);

  width:min(92%,700px);

  display:flex;
  justify-content:center;
  gap:clamp(15px,5vw,45px);
}

.garden-choice{
  width:clamp(105px,28vw,175px);
  aspect-ratio:1/1;

  border:none;
  border-radius:50%;

  cursor:pointer;
  touch-action:manipulation;

  background:
    rgba(255,255,255,.58);

  box-shadow:
    0 12px 35px rgba(130,100,100,.12),
    inset 0 0 25px rgba(255,255,255,.65);

  font-size:
    clamp(50px,12vw,82px);
}

.garden-grass{
  position:absolute;

  bottom:-5%;
  left:-5%;

  width:110%;
  height:25%;

  border-radius:
    50% 50% 0 0;

  background:
    rgba(182,207,153,.32);
}


/* =========================
   🌸 呼吸花
========================= */

.garden-room{
  position:fixed;
  inset:0;

  z-index:70;

  display:none;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.95),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #fff9f2,
      #f9e9e7 62%,
      #e9f0df
    );
}

.garden-room.open{
  display:block;
}

/* V2.1：呼吸花永遠顯示在種花畫面上方 */
#breathingGarden.open{
  z-index:95;
}

.breathe-text{
  position:absolute;

  top:18%;

  width:100%;

  text-align:center;

  font-family:Georgia,serif;

  font-size:
    clamp(22px,5vw,34px);

  color:#806a72;
}

.breathing-flower{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:
    clamp(110px,28vw,190px);

  filter:
    drop-shadow(
      0 12px 20px
      rgba(160,100,120,.15)
    );

  animation:
    breatheFlower
    7s ease-in-out infinite;
}

@keyframes breatheFlower{

  0%{
    transform:
      translate(-50%,-50%)
      scale(.78);

    opacity:.82;
  }

  43%{
    transform:
      translate(-50%,-50%)
      scale(1.12);

    opacity:1;
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(.78);

    opacity:.82;
  }
}


/* =========================
   🌱 新版種花世界
========================= */

.growing-room{
  background:
    linear-gradient(
      180deg,
      #fcefdc 0%,
      #f7e6cf 52%,
      #dce9c6 53%,
      #bfd59f 100%
    );
}


/* 太陽 */

.garden-sun{
  position:absolute;

  top:9%;
  right:10%;

  width:75px;
  height:75px;

  border-radius:50%;

  background:
    rgba(255,220,133,.65);

  box-shadow:
    0 0 40px
    rgba(255,213,120,.45);
}


/* 雲 */

.garden-cloud{
  position:absolute;

  color:
    rgba(255,255,255,.72);

  font-size:75px;

  pointer-events:none;
}

.cloud-a{
  top:13%;
  left:-100px;

  animation:
    cloudMoveOne
    34s linear infinite;
}

.cloud-b{
  top:25%;
  left:-140px;

  font-size:55px;

  opacity:.7;

  animation:
    cloudMoveTwo
    47s linear infinite;
}

@keyframes cloudMoveOne{

  from{
    left:-120px;
  }

  to{
    left:110%;
  }
}

@keyframes cloudMoveTwo{

  from{
    left:-150px;
  }

  to{
    left:110%;
  }
}


/* 蝴蝶 */

.butterfly{
  position:absolute;

  z-index:5;

  top:35%;
  left:-60px;

  font-size:28px;

  pointer-events:none;

  animation:
    butterflyFly
    18s ease-in-out infinite;
}

@keyframes butterflyFly{

  0%{
    left:-60px;
    top:40%;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  30%{
    top:31%;
  }

  55%{
    top:42%;
  }

  80%{
    top:28%;
  }

  92%{
    opacity:1;
  }

  100%{
    left:110%;
    top:36%;
    opacity:0;
  }
}


/* 更多蝴蝶：不同高度、速度與延遲 */
.butterfly.b2{animation-duration:23s;animation-delay:-7s;font-size:23px;}
.butterfly.b3{animation-duration:29s;animation-delay:-15s;font-size:20px;}
.butterfly.b4{animation-duration:21s;animation-delay:-3s;font-size:25px;}
.butterfly.b2{filter:hue-rotate(35deg);}
.butterfly.b3{filter:hue-rotate(90deg);}
.butterfly.b4{filter:hue-rotate(155deg);}

/* 草地 */

.garden-field{
  position:absolute;

  left:-5%;
  bottom:-5%;

  width:110%;
  height:38%;

  border-radius:
    48% 48% 0 0;

  background:
    linear-gradient(
      #c7dda9,
      #a9c985
    );
}


/* 小草裝飾 */

.grass-decoration{
  position:absolute;

  bottom:12%;

  font-size:36px;

  opacity:.65;
}

.grass-one{
  left:7%;
}

.grass-two{
  right:8%;
}

.grass-three{
  left:20%;
  bottom:5%;
}


/* 石頭 */

.rock{
  position:absolute;

  width:48px;
  height:25px;

  border-radius:
    50% 55% 35% 40%;

  background:#b7aa9b;

  opacity:.6;
}

.rock-one{
  bottom:12%;
  left:12%;
}

.rock-two{
  bottom:7%;
  right:15%;

  transform:scale(.7);
}


/* 木牌 */

.garden-sign{
  position:absolute;

  z-index:5;

  left:8%;
  bottom:22%;

  padding:10px 15px;

  border-radius:5px;

  color:#76543d;

  background:#d8ad79;

  box-shadow:
    0 5px 10px
    rgba(80,60,40,.12);

  font-family:Georgia,serif;

  font-size:
    clamp(13px,3vw,18px);

  transform:rotate(-4deg);
}

.garden-sign::after{
  content:"";

  position:absolute;

  left:50%;
  top:100%;

  width:7px;
  height:48px;

  transform:
    translateX(-50%);

  background:#a77d55;
}


/* 種植主要區域 */

.grow-area{
  position:absolute;

  z-index:10;

  left:50%;
  top:55%;

  transform:
    translate(-50%,-50%);

  width:min(94%,520px);
  height:520px;
}


/* 澆花器 */

.water-button{
  position:absolute;

  z-index:30;

  left:50%;
  top:15px;

  transform:
    translateX(-50%);

  width:94px;
  height:82px;

  border:none;
  border-radius:24px;

  cursor:pointer;
  touch-action:manipulation;

  background:
    rgba(255,255,255,.55);

  box-shadow:
    0 8px 24px
    rgba(120,90,90,.10);

  transition:
    transform .15s ease;
}

.water-button:active{
  transform:
    translateX(-50%)
    rotate(-15deg)
    scale(.95);
}

.water-button svg{
  width:72px;
  height:58px;
}


/* 水滴 */

.water-drop{
  position:absolute;

  z-index:25;

  left:58%;
  top:85px;

  font-size:25px;

  pointer-events:none;

  animation:
    waterFall
    .85s ease-in forwards;
}

@keyframes waterFall{

  0%{
    opacity:1;

    transform:
      translateY(0)
      scale(.8);
  }

  80%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translateY(180px)
      scale(1.05);
  }
}


/* 植物區 */

.grow-display{
  position:absolute;

  left:50%;
  bottom:50px;

  transform:
    translateX(-50%);

  width:260px;
  height:330px;
}

.plant{
  position:absolute;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:210px;
  height:310px;
}


/* 土 */

.soil{
  position:absolute;

  z-index:5;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  width:190px;
  height:48px;

  border-radius:50%;

  background:
    linear-gradient(
      #a8785f,
      #8d634e
    );

  box-shadow:
    inset 0 5px 8px
    rgba(255,255,255,.12);
}


/* 種子 */

.seed{
  position:absolute;

  z-index:6;

  left:50%;
  bottom:36px;

  transform:
    translateX(-50%);

  width:14px;
  height:10px;

  border-radius:50%;

  background:#76533f;

  transition:
    opacity .35s;
}


/* 莖 */

.dynamic-stem{
  position:absolute;

  z-index:4;

  left:50%;
  bottom:40px;

  transform:
    translateX(-50%);

  width:7px;
  height:0;

  border-radius:8px;

  background:
    linear-gradient(
      90deg,
      #6c9c5d,
      #8db979
    );

  transition:
    height .45s ease,
    width .45s ease;
}


/* 葉子 */

.leaf{
  position:absolute;

  z-index:7;

  width:0;
  height:0;

  opacity:0;

  background:#82ad6c;

  transition:
    width .4s ease,
    height .4s ease,
    opacity .4s ease,
    bottom .4s ease;
}

.leaf.left{
  right:50%;

  border-radius:
    100% 0 100% 0;

  transform:
    rotate(10deg);
}

.leaf.right{
  left:50%;

  border-radius:
    0 100% 0 100%;

  transform:
    rotate(-10deg);
}


/* 花苞 */

.flower-bud{
  position:absolute;

  z-index:8;

  left:50%;

  bottom:55px;

  transform:
    translateX(-50%)
    scale(0);

  font-size:32px;

  opacity:0;

  transition:
    bottom .45s ease,
    transform .45s ease,
    opacity .45s ease;
}


/* 最終花 */

.final-flower{
  position:absolute;

  z-index:20;

  left:50%;

  bottom:210px;

  transform:
    translateX(-50%)
    scale(0);

  font-size:90px;

  opacity:0;

  filter:
    drop-shadow(
      0 8px 12px
      rgba(130,80,80,.16)
    );

  transition:
    transform .8s
    cubic-bezier(.2,1.6,.4,1),
    opacity .5s;
}

.final-flower.show{
  transform:
    translateX(-50%)
    scale(1);

  opacity:1;
}


/* 開花提示 */

.bloom-message{
  position:absolute;

  z-index:50;

  left:50%;
  bottom:12px;

  transform:
    translateX(-50%)
    translateY(10px);

  width:90%;

  text-align:center;

  color:#725d62;

  font-size:18px;

  font-weight:bold;

  opacity:0;

  transition:
    opacity .5s,
    transform .5s;
}

.bloom-message.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* 再種一朵 */

.plant-again{
  position:absolute;

  z-index:60;

  right:15px;
  bottom:18px;

  display:none;

  padding:10px 15px;

  border:none;
  border-radius:20px;

  cursor:pointer;

  color:#745d62;

  background:
    rgba(255,255,255,.70);

  box-shadow:
    0 5px 15px

========================= */

  to{
    opacity:1;

@keyframes roseBloom{

  100%{

.castle-landscape svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 7px rgba(46,48,68,.19))}

.castle-boy.hit{animation:castleBop .35s ease}.castle-impact{position:absolute;top:3%;right:-12%;font-size:32px;opacity:0}.castle-impact.show{animation:castleImpact .5s ease}

.castle-status{position:absolute;right:15px;top:max(18px,env(safe-area-inset-top));z-index:5;border-radius:18px;background:rgba(32,34,75,.46);padding:9px 12px;color:#fff5d7;font-size:13px;pointer-events:none}
.castle-world .back-button{z-index:120}.castle-tap-area{position:absolute;inset:70px 0 7%;z-index:4;background:transparent;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

<script>

/* =========================
   ⭐ V2 星星世界：每輪可收藏一顆
========================= */
const STAR_COUNT=16;
const STAR_SAVE_KEY="1wenStarCollectionV2";
const STAR_REWARDS=["⭐","🌸","🐰","✨","💗","🌙"];
let specialStars=[];
let foundSpecial=0;
let normalStars=[];
let revealedNormal=0;
let collectionMode=false;
let starRoundFinished=false;
let lastStarWorldTap=0;

function newStarSave(){
  return { core:{fang:{x:42,y:42},wen:{x:58,y:46}}, collected:[] };
}
function loadStarSave(){
  try{
    const raw=localStorage.getItem(STAR_SAVE_KEY);
    return raw ? Object.assign(newStarSave(),JSON.parse(raw)) : newStarSave();
  }catch(e){ return newStarSave(); }
}
let starSave=loadStarSave();
function saveStarCollection(){
  try{localStorage.setItem(STAR_SAVE_KEY,JSON.stringify(starSave));}catch(e){}
}
function openStarWorld(){
  document.getElementById("starWorld").classList.add("open");
  createStars();
}
function closeStarWorld(){
  document.getElementById("starWorld").classList.remove("open");
  document.getElementById("starField").innerHTML="";
  specialStars=[]; normalStars=[]; foundSpecial=0; revealedNormal=0; collectionMode=false; starRoundFinished=false;
}
function createStars(){
  const field=document.getElementById("starField");
  field.innerHTML=""; specialStars=[]; normalStars=[]; foundSpecial=0; revealedNormal=0; collectionMode=false; starRoundFinished=false;
  renderSavedStarsInStarWorld();
  const fang=createOneStar(starSave.core.fang.x,starSave.core.fang.y,true,"芳樑");
  const wen=createOneStar(starSave.core.wen.x,starSave.core.wen.y,true,"1WEN");
  specialStars=[fang,wen];
  const occupied=[...starSave.collected.map(x=>({x:x.x,y:x.y})),starSave.core.fang,starSave.core.wen];
  for(let i=0;i<STAR_COUNT-2;i++){
    const pos=findSafeStarPosition(occupied);
    occupied.push(pos);
    const star=createOneStar(pos.x,pos.y,false,"");
    normalStars.push(star);
  }
  const hint=document.createElement("div"); hint.id="starCollectionHint"; hint.className="star-collection-hint";
  field.appendChild(hint);
}
function findSafeStarPosition(occupied){
  const field=document.getElementById("starField");
  const w=Math.max(field.clientWidth,320), h=Math.max(field.clientHeight,500);
  const minPx=w<500?64:58;
  for(let tries=0;tries<180;tries++){
    const p={x:randomNumber(8,92),y:randomNumber(12,86)};
    const ok=occupied.every(o=>{
      const dx=(p.x-o.x)/100*w, dy=(p.y-o.y)/100*h;
      return Math.hypot(dx,dy)>=minPx;
    });
    if(ok)return p;
  }
  return {x:randomNumber(8,92),y:randomNumber(12,86)};
}
function createOneStar(x,y,special,name){
  const field=document.getElementById("starField");
  const star=document.createElement("button");
  star.type="button"; star.className="sky-star"; star.style.left=x+"%"; star.style.top=y+"%";
  star.dataset.x=x; star.dataset.y=y;
  if(special){
    star.classList.add("special"); star.dataset.name=name;
    star.addEventListener("click",()=>findSpecialStar(star));
  }else{
    star.dataset.reward=STAR_REWARDS[Math.floor(Math.random()*STAR_REWARDS.length)];
    star.addEventListener("click",()=>revealNormalStar(star));
  }
  field.appendChild(star); return star;
}
function revealNormalStar(star){
  if(collectionMode){ chooseCollectedStar(star); return; }
  if(star.classList.contains("revealed"))return;
  star.classList.add("revealed"); star.textContent=star.dataset.reward; revealedNormal++;
  checkRoundComplete();
}
function findSpecialStar(star){
  if(star.classList.contains("found"))return;
  star.classList.add("found");
  const label=document.createElement("span"); label.className="star-name"; label.textContent=star.dataset.name; star.appendChild(label);
  foundSpecial++;
  if(foundSpecial===1){showHint(specialStars.find(item=>item!==star));}
  if(foundSpecial===2){removeHint();connectSpecialStars();checkRoundComplete();}
}
function checkRoundComplete(){
  if(foundSpecial===2 && revealedNormal===normalStars.length){
    collectionMode=true;
    normalStars.forEach(star=>star.classList.add("collectable"));
    const hint=document.getElementById("starCollectionHint");
    if(hint){hint.textContent="選一顆今晚想留下的星 ♡";hint.classList.add("show");}
  }
}
function chooseCollectedStar(star){
  if(!collectionMode || !star.classList.contains("revealed"))return;
  collectionMode=false;
  normalStars.forEach(x=>x.classList.remove("collectable")); star.classList.add("collected-choice");
  const item={type:star.dataset.reward,x:parseFloat(star.dataset.x),y:parseFloat(star.dataset.y)};
  starSave.collected.push(item); saveStarCollection();
  starRoundFinished=true;
  const hint=document.getElementById("starCollectionHint");
  if(hint){hint.textContent=item.type+" 已經留在 1WEN 的星空裡 ♡　點兩下天空可以再玩一次";hint.classList.add("show");}
  renderGardenSky();
}
function renderSavedStarsInStarWorld(){
  const field=document.getElementById("starField");
  starSave.collected.forEach(item=>{
    const el=document.createElement("div"); el.className="sky-star revealed saved-star";
    el.style.left=item.x+"%";el.style.top=item.y+"%";el.textContent=item.type;el.style.pointerEvents="none";
    field.appendChild(el);
  });
}
function renderGardenSky(){
  const sky=document.getElementById("gardenSkyCollection"); if(!sky)return; sky.innerHTML="";
  [{name:"芳樑",...starSave.core.fang},{name:"1WEN",...starSave.core.wen}].forEach(core=>{
    const wrap=document.createElement("div");wrap.className="garden-sky-item core";wrap.style.left=core.x+"%";wrap.style.top=core.y+"%";
    wrap.innerHTML='✦<div class="garden-sky-name">'+core.name+'</div>';sky.appendChild(wrap);
  });
  starSave.collected.forEach(item=>{
    const el=document.createElement("div");el.className="garden-sky-item";el.style.left=item.x+"%";el.style.top=item.y+"%";el.textContent=item.type;sky.appendChild(el);
  });
}
function showHint(target){
  removeHint(); const hint=document.createElement("div");hint.className="hint-glow";hint.id="hintGlow";
  hint.style.left=target.dataset.x+"%";hint.style.top=target.dataset.y+"%";document.getElementById("starField").appendChild(hint);
}
function removeHint(){const old=document.getElementById("hintGlow");if(old)old.remove();}
function connectSpecialStars(){
  const field=document.getElementById("starField"),first=specialStars[0],second=specialStars[1],rect=field.getBoundingClientRect();
  const x1=parseFloat(first.dataset.x)/100*rect.width,y1=parseFloat(first.dataset.y)/100*rect.height;
  const x2=parseFloat(second.dataset.x)/100*rect.width,y2=parseFloat(second.dataset.y)/100*rect.height;
  const dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;
  const line=document.createElement("div");line.className="connection-line";line.style.left=x1+"px";line.style.top=y1+"px";line.style.width=length+"px";line.style.transform="rotate("+angle+"deg)";
  field.insertBefore(line,field.firstChild);requestAnimationFrame(()=>line.classList.add("show"));
}
function randomNumber(min,max){return Math.random()*(max-min)+min;}

/* V2.1：完成收藏後，連點兩下星空直接開始新一輪 */
document.getElementById("starWorld").addEventListener("click",function(e){
  if(!starRoundFinished)return;
  if(e.target.closest(".back-button"))return;
  const now=Date.now();
  if(now-lastStarWorldTap<520){
    lastStarWorldTap=0;
    createStars();
  }else{
    lastStarWorldTap=now;
  }
});

/* =========================
   🌷 花園首頁
========================= */

function openGardenWorld(){ openGrowingGarden(); }

function closeGardenWorld(){
  document.getElementById("gardenWorld").classList.remove("open");
}



/* =========================
   🌸 呼吸花
========================= */

function openBreathingGarden(){
  /* V2.2：從種花畫面直接切換到呼吸花，不讓兩個全螢幕畫面疊在一起 */
  const growing=document.getElementById("growingGarden");
  const breathing=document.getElementById("breathingGarden");
  if(growing) growing.classList.remove("open");
  if(breathing) breathing.classList.add("open");
}

function closeBreathingGarden(){
  /* 返回時直接回到種花世界 */
  const breathing=document.getElementById("breathingGarden");
  const growing=document.getElementById("growingGarden");
  if(breathing) breathing.classList.remove("open");
  if(growing){
    growing.classList.add("open");
    renderCollectedGarden();
    renderGardenSky();
  }
}



/* =========================
   🌱 花朵資料
========================= */

const flowerData=[
  {id:"sakura",emoji:"🌸",name:"櫻花",target:5},
  {id:"sunflower",emoji:"🌻",name:"向日葵",target:2},
  {id:"rose",emoji:"🌹",name:"玫瑰",target:1},
  {id:"lavender",emoji:"🪻",name:"薰衣草",target:1},
  {id:"daisy",emoji:"🌼",name:"雛菊",target:3},
  {id:"tulip",emoji:"🌷",name:"鬱金香",target:1},
  {id:"hibiscus",emoji:"🌺",name:"扶桑花",target:4},
  {id:"cherry",emoji:"🌺",name:"山茶花",target:1},
  {id:"blossom",emoji:"💮",name:"白花",target:1},
  {id:"lotus",emoji:"🪷",name:"蓮花",target:1},
  {id:"hyacinth",emoji:"🪻",name:"風信子",target:1},
  {id:"fourleaf",emoji:"🍀",name:"幸運草",target:1},
  {id:"bouquet",emoji:"💐",name:"繽紛花束",target:1}
];


/* =========================
   花冊存檔
========================= */

const SAVE_KEY=
  "1wenFlowerBookV1";


function newFlowerSave(){
  const result={roseUnlocked:true};
  flowerData.forEach(f=>{result[f.id]=0;});
  return result;
}

function loadFlowerSave(){

  try{

    const saved=
      localStorage.getItem(
        SAVE_KEY
      );

    if(!saved){
      return newFlowerSave();
    }

    return Object.assign(
      newFlowerSave(),
      JSON.parse(saved)
    );

  }catch(error){

    return newFlowerSave();
  }
}


let flowerSave=
  loadFlowerSave();


function saveFlowerBook(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(
        flowerSave
      )
    );

  }catch(error){

    console.log(
      "Flower save unavailable"
    );
  }
}



/* =========================
   選擇下一朵花
========================= */

function chooseNextFlower(){
  const undiscovered=flowerData.filter(f=>(flowerSave[f.id]||0)===0);
  const pool=undiscovered.length ? undiscovered : flowerData;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* =========================
   🌱 種花系統
========================= */

let waterCount=0;

let currentFlower=null;

let plantFinished=false;
let bloomLockedUntil=0;
let bloomPending=false;


function openGrowingGarden(){

  document
    .getElementById(
      "growingGarden"
    )
    .classList.add(
      "open"
    );

  renderCollectedGarden();
  renderGardenSky();
  resetPlant();
}


function closeGrowingGarden(){

  document
    .getElementById(
      "growingGarden"
    )
    .classList.remove(
      "open"
    );
}


function resetPlant(){

  waterCount=0;

  plantFinished=false;
  bloomPending=false;
  bloomLockedUntil=0;

  currentFlower=
    chooseNextFlower();


  document
    .getElementById(
      "seed"
    )
    .style.opacity="1";


  const stem=
    document.getElementById(
      "dynamicStem"
    );

  stem.style.height="0px";
  stem.style.width="7px";


  [
    "leaf1",
    "leaf2",
    "leaf3",
    "leaf4"
  ]
  .forEach(id=>{

    const leaf=
      document.getElementById(
        id
      );

    leaf.style.width="0px";
    leaf.style.height="0px";
    leaf.style.opacity="0";
    leaf.style.bottom="45px";
  });


  const bud=
    document.getElementById(
      "flowerBud"
    );

  bud.style.bottom="55px";

  bud.style.transform=
    "translateX(-50%) scale(0)";

  bud.style.opacity="0";

  bud.textContent="🌱";


  const flower=
    document.getElementById(
      "finalFlower"
    );

  flower.classList.remove(
    "show"
  );

  flower.textContent="";


  const message=
    document.getElementById(
      "bloomMessage"
    );

  message.classList.remove(
    "show"
  );

  message.textContent="";
}



/* =========================
   每次澆水
========================= */

function waterPlant(){
  if(bloomPending) return;
  if(plantFinished){
    if(Date.now()<bloomLockedUntil) return;
    resetPlant();
  }
  if(waterCount>=10) return;
  waterCount++;
  showWaterDrop();
  const stages=[1,2,3,4,5,6,8,10,12,15];
  growPlantStage(stages[waterCount-1]);
  if(waterCount===10){
    bloomPending=true;
    setTimeout(()=>{
      if(!bloomPending)return;
      finishFlower();
      bloomPending=false;
      bloomLockedUntil=Date.now()+2000;
    },450);
  }
}

/* =========================
   💧 水滴
========================= */

function showWaterDrop(){

  const area=
    document.querySelector(
      ".grow-area"
    );

  const drop=
    document.createElement(
      "div"
    );

  drop.className=
    "water-drop";

  drop.textContent=
    "💧";

  area.appendChild(drop);


  setTimeout(
    ()=>{
      drop.remove();
    },
    900
  );
}



/* =========================
   🌱 15 階段成長
========================= */

function growPlantStage(stage){

  const stem=
    document.getElementById(
      "dynamicStem"
    );

  const seed=
    document.getElementById(
      "seed"
    );

  const bud=
    document.getElementById(
      "flowerBud"
    );


  /*
    1～3：
    剛發芽
  */

  if(stage===1){

    stem.style.height=
      "14px";
  }


  if(stage===2){

    stem.style.height=
      "28px";

    seed.style.opacity=
      ".7";
  }


  if(stage===3){

    stem.style.height=
      "43px";

    seed.style.opacity=
      "0";
  }


  /*
    4～6：
    第一、第二片葉子
  */

  if(stage===4){

    stem.style.height=
      "60px";

    showLeaf(

========================= */

const collectedFlowerSlots={
  sakura:[
    [10,38],[14,34],[18,39],[22,33],[26,38]
  ],
  sunflower:[
    [31,72],[35,68]
  ],
  lavender:[
    [39,35]
  ],
  daisy:[
    [67,35],[71,31],[75,37]
  ],
  tulip:[
    [79,70]
  ],
  hibiscus:[
    [84,38],[88,33],[92,38],[96,32]
  ],
  rose:[[62,66]],
  cherry:[[8,55]],
  blossom:[[43,30]],
  lotus:[[57,30]],
  hyacinth:[[94,57]],
  fourleaf:[[27,56]],
  bouquet:[[75,57]]
};

function createCollectedBloom(flower,x,y,extra=false){
  const patch=document.createElement("div");
  patch.className="flower-patch"+(extra?" extra-flower":"");
  patch.style.left=x+"%";
  patch.style.top=y+"%";

  const bloom=document.createElement("div");
  bloom.className="garden-bloom "+flower.id;

  const flowerHead=document.createElement("div");
  flowerHead.className="garden-bloom-flower";
  flowerHead.textContent=flower.emoji;

  const stem=document.createElement("div");
  stem.className="garden-bloom-stem";

  const leafLeft=document.createElement("div");
  leafLeft.className="garden-bloom-leaf left";

  const leafRight=document.createElement("div");
  leafRight.className="garden-bloom-leaf right";

  const soil=document.createElement("div");
  soil.className="garden-bloom-soil";

  bloom.appendChild(stem);
  bloom.appendChild(leafLeft);
  bloom.appendChild(leafRight);
  bloom.appendChild(soil);
  bloom.appendChild(flowerHead);
  patch.appendChild(bloom);

  return patch;
}

function stableRandomPosition(seed){
  /* 每一朵額外花的位置固定，不會每次進畫面亂跳 */
  const x=8+((seed*37)%86);
  const y=30+((seed*53)%48);

  /* 中央留給正在種植的大花，避免重疊 */
  if(x>42 && x<61 && y>48){
    return {x:x+22,y:y-12};
  }
  return {x,y};
}

function renderCollectedGarden(){
  const garden=document.getElementById("collectedGarden");
  if(!garden) return;

  garden.innerHTML="";
  let extraSeed=1;

  flowerData.forEach(flower=>{
    const count=flowerSave[flower.id] || 0;
    if(count<=0) return;


    const slots=collectedFlowerSlots[flower.id] || [];
    const fixedLimit=flower.target;
    const fixedCount=Math.min(count,fixedLimit,slots.length);

    for(let i=0;i<fixedCount;i++){
      const [x,y]=slots[i];
      garden.appendChild(createCollectedBloom(flower,x,y));
    }

    /* 目標完成後若繼續種到同種花，才增加隨機位置 */
    const extraCount=Math.max(0,count-fixedLimit);
    for(let i=0;i<extraCount;i++){
      const pos=stableRandomPosition(extraSeed*11+i*7+flower.id.length*13);
      garden.appendChild(createCollectedBloom(flower,pos.x,pos.y,true));
    }

    extraSeed+=17;
  });
}

}

function showResetDialog(){
  resetStep=1;
  document.getElementById("resetDescription").textContent="這會清除所有收藏星星、已種花朵，三個世界會重新開始。此操作無法復原。確定要繼續嗎？";
  document.getElementById("resetStep2").style.display="none";
  document.getElementById("resetInput").value="";
  const button=document.getElementById("resetConfirm");
  button.textContent="繼續確認";
  button.disabled=false;
  document.getElementById("resetBackdrop").classList.add("show");
}
function hideResetDialog(){document.getElementById("resetBackdrop").classList.remove("show");}
function updateResetConfirm(){
  document.getElementById("resetConfirm").disabled=document.getElementById("resetInput").value.trim()!=="重置";
}
function nextResetStep(){
  if(resetStep===1){
    resetStep=2;
    document.getElementById("resetDescription").textContent="最後一次確認：星星、花朵與城堡的累積紀錄將永久清除。";
    document.getElementById("resetStep2").style.display="block";
    const button=document.getElementById("resetConfirm");
    button.textContent="確定清除全部收藏";
    button.disabled=true;
    document.getElementById("resetInput").focus();
    return;
  }
  if(document.getElementById("resetInput").value.trim()!=="重置")return;
  try{
    localStorage.removeItem(SAVE_KEY);
    localStorage.removeItem(STAR_SAVE_KEY);
    localStorage.removeItem(CASTLE_SAVE_KEY);
  }catch(error){
    alert("無法清除瀏覽器儲存資料，請確認沒有使用限制儲存的模式。");
    return;
  }
  location.reload();
}

</script>

</body>
</html>
