<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>1WEN's Garden</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #070b1b;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

/* ===== 首頁 ===== */

.home {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;

    background-image:
        linear-gradient(
            rgba(5, 8, 25, 0.15),
            rgba(5, 8, 25, 0.40)
        ),
        url("./star-garden.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* 夢幻柔光 */

.home::after {
    content: "";
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(160, 180, 255, 0.14),
            transparent 40%
        );
}

/* ===== 三個世界入口 ===== */

.worlds {
    position: absolute;
    z-index: 2;

    left: 50%;
    bottom: 7vh;

    transform: translateX(-50%);

    width: min(92%, 720px);

    display: flex;
    justify-content: space-around;
    align-items: center;

    gap: 16px;
}

.world {
    width: clamp(88px, 23vw, 145px);
    aspect-ratio: 1 / 1;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,0.30),
            rgba(255,255,255,0.08) 55%,
            rgba(255,255,255,0.04)
        );

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35),
        inset 0 0 20px rgba(255,255,255,0.08);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.world:active {
    transform: scale(0.92);
}

.icon {
    font-size: clamp(45px, 12vw, 75px);
    line-height: 1;

    filter:
        drop-shadow(0 4px 10px rgba(0,0,0,0.35));
}

/* 星星入口 */

.star {
    box-shadow:
        0 0 30px rgba(255,220,120,0.22),
        0 8px 30px rgba(0,0,0,0.35);
}

/* 花園入口 */

.garden {
    box-shadow:
        0 0 30px rgba(255,160,190,0.20),
        0 8px 30px rgba(0,0,0,0.35);
}

/* 兔兔入口 */

.bunny {
    box-shadow:
        0 0 30px rgba(255,255,255,0.18),
        0 8px 30px rgba(0,0,0,0.35);
}

/* 電腦滑鼠移過去 */

@media (hover: hover) {

    .world:hover {
        transform: translateY(-8px) scale(1.05);
    }

    .star:hover {
        box-shadow:
            0 0 45px rgba(255,220,120,0.48),
            0 10px 35px rgba(0,0,0,0.40);
    }

    .garden:hover {
        box-shadow:
            0 0 45px rgba(255,160,190,0.38),
            0 10px 35px rgba(0,0,0,0.40);
    }

    .bunny:hover {
        box-shadow:
            0 0 45px rgba(255,255,255,0.32),
            0 10px 35px rgba(0,0,0,0.40);
    }
}

/* ===== 手機版 ===== */

@media (max-width: 600px) {

    .home {
        background-position: center center;
    }

    .worlds {
        bottom: max(6vh, 40px);
        gap: 10px;
    }

    .world {
        width: 28vw;
        max-width: 112px;
    }
}

</style>
</head>

<body>

<main class="home">

    <div class="worlds">

        <button class="world star" aria-label="星星世界">
            <span class="icon">⭐</span>
        </button>

        <button class="world garden" aria-label="花園世界">
            <span class="icon">🌷</span>
        </button>

        <button class="world bunny" aria-label="兔兔世界">
            <span class="icon">🐰</span>
        </button>

    </div>

</main>

</body>
</html>
